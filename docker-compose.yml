# QueueApp — development environment
#
# Tiga service, sesuai arsitektur di docs/requirements.md:
#   mysql   → database
#   server  → API
#   web     → client browser
#
# Nilai variabel dibaca dari file .env
# (salin dari .env.example).
#
# Perintah dasar:
#   docker compose up -d       → menjalankan seluruh service
#   docker compose ps          → melihat status service
#   docker compose logs -f     → melihat log
#   docker compose down        → menghentikan service

services:

  # --------------------------------------------------------------------------
  # Database
  # Schema-nya belum ada — itu pekerjaan Minggu 10.
  # Untuk sekarang container ini hanya perlu hidup dan siap menerima koneksi.
  # --------------------------------------------------------------------------

  mysql:
    image: mysql:8.0
    container_name: queueapp-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    ports:
      # host:container — port host dibuat berbeda agar tidak bentrok
      # dengan MySQL yang mungkin sudah terpasang di komputer sendiri.
      - "${DB_HOST_PORT}:3306"

    volumes:
      # Named volume: data tetap ada walaupun container dihapus.
      - mysql_data:/var/lib/mysql

    networks:
      - queueapp

  # --------------------------------------------------------------------------
  # API
  # Minggu 01 masih placeholder Node tanpa dependency.
  # Express masuk pada Minggu 09, koneksi MySQL pada Minggu 10.
  # --------------------------------------------------------------------------

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: queueapp-server
    restart: unless-stopped

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${SERVER_PORT}:3000"

    depends_on:
      - mysql

    networks:
      - queueapp

  web:
    image: nginx:alpine
    container_name: queueapp-web
    restart: unless-stopped

    ports:
      - "${WEB_PORT}:80"

    volumes:
      - ./web:/usr/share/nginx/html:ro

    depends_on:
      - server

    networks:
      - queueapp


volumes:
  mysql_data:


networks:
  queueapp:
    driver: bridge

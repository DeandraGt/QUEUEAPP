
# --------------------------------------------------------------------------
# Dev server Vite, menggantikan Nginx yang sebelumnya melayani HTML statis.
#
# Vite melayani berkas sumber secara langsung dan menyuntikkan perubahan
# ke peramban tanpa memuat ulang halaman (Hot Module Replacement/HMR),
# sehingga tidak ada langkah build selama pengembangan.
# --------------------------------------------------------------------------
web:
  # Bookworm (glibc), bukan Alpine (musl).
  # Dependency Vite memuat binary native seperti rolldown dan lightningcss
  # yang memiliki varian berbeda untuk glibc dan musl.
  # package-lock.json dibuat di lingkungan glibc, sehingga image glibc
  # menjaga kesesuaian antara container dan lockfile.
  image: node:20-bookworm-slim
  container_name: queueapp-web
  restart: unless-stopped
  working_dir: /app

  # npm ci memasang dependency sesuai package-lock.json.
  # Pemasangan dilewati jika dependency Vite sudah tersedia.
  command: >
    sh -c "[ -d node_modules/vite ] ||
    npm ci --no-audit --no-fund;
    npm run dev"

  ports:
    - "${WEB_PORT}:5173"

  volumes:
    - ./web:/app
    # Volume anonim agar node_modules di container tidak tertimpa
    # oleh folder dari host dan dependency Linux tetap terisolasi.
    - /app/node_modules

  depends_on:
    - server

  networks:
    - queueapp
